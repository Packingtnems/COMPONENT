<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Tìm kiếm Hình ảnh Google Drive</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tra cứu Ảnh">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Dùng bản UMD chính thức mới nhất -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary-color: #0ea5e9;
            --hover-color: #0284c7;
            --scan-color: #8b5cf6;
            --scan-hover: #7c3aed;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .search-wrapper {
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .search-wrapper h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        #searchInput {
            padding: 12px 20px;
            width: 400px;
            max-width: 100%;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--hover-color);
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        #scanBtn {
            background-color: var(--scan-color);
        }
        #scanBtn:hover:not(:disabled) {
            background-color: var(--scan-hover);
        }

        button:disabled, #searchInput:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background-color: #cbd5e1;
        }

        .status-message {
            margin-top: 15px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .image-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            text-align: center;
            width: 320px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .image-container {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #f1f5f9;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .image-name {
            margin-top: 15px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            word-wrap: break-word;
            padding-bottom: 5px;
        }

        #noResultMessage {
            text-align: center;
            color: #ef4444;
            display: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 40px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Giao diện vùng quét Camera */
        #scanner-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        #reader video {
            width: 100% !important;
            height: auto !important;
            display: block;
        }

        #reader__scan_region {
            background: transparent !important;
        }

        #reader__dashboard {
            display: none !important;
        }

        #scanner-hint {
            color: #fff;
            margin-top: 15px;
            font-size: 15px;
            text-align: center;
            max-width: 500px;
        }

        #closeScanBtn {
            margin-top: 20px;
            background-color: #ef4444;
            padding: 12px 40px;
        }
        #closeScanBtn:hover {
            background-color: #dc2626;
        }

        #scan-error {
            color: #fca5a5;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            max-width: 500px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="search-wrapper">
        <h2>HỆ THỐNG TRA CỨU HÌNH ẢNH</h2>
        <div class="search-controls">
            <input type="text" id="searchInput" placeholder="Nhập mã hoặc quét QR/Barcode..." disabled>
            <button id="searchBtn" onclick="searchImages()" disabled>Đang kết nối...</button>
            <button id="scanBtn" onclick="openScanner()" disabled>📷 Quét Mã</button>
        </div>
        <div class="status-message" id="statusMessage">Đang tải đồng bộ dữ liệu từ Google Drive, vui lòng đợi...</div>
    </div>

    <div class="gallery" id="imageGallery"></div>
    <div id="noResultMessage">Không tìm thấy hình ảnh nào khớp với mã bạn nhập.</div>

    <div id="scanner-modal">
        <div id="reader"></div>
        <div id="scanner-hint">Đưa mã QR / Barcode vào giữa khung hình</div>
        <div id="scan-error"></div>
        <button id="closeScanBtn" onclick="closeScanner()">Đóng Camera</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxw7m0YfNZavtlJ8z7Is-XjQgtIQ2yKhxVnhbkrpvgxx7XEvOs98vuqZb0CEWi18vNr/exec";

        let driveDatabase = [];
        let html5QrCode = null;   // instance class lõi
        let isScanning = false;   // cờ chống gọi trùng

        /* ============================================================
           1) TẢI DỮ LIỆU TỪ GOOGLE DRIVE
        ============================================================ */
        async function fetchDriveData() {
            const statusMsg = document.getElementById("statusMessage");
            const searchInput = document.getElementById("searchInput");
            const searchBtn = document.getElementById("searchBtn");
            const scanBtn = document.getElementById("scanBtn");

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("HTTP " + response.status);
                driveDatabase = await response.json();

                statusMsg.style.color = "#16a34a";
                statusMsg.textContent = `Đã đồng bộ thành công ${driveDatabase.length} ảnh. Sẵn sàng tìm kiếm!`;
                searchInput.disabled = false;
                searchBtn.disabled = false;
                scanBtn.disabled = false;
                searchBtn.textContent = "Tìm kiếm";
            } catch (error) {
                console.error("Lỗi kết nối API:", error);
                statusMsg.style.color = "#dc2626";
                statusMsg.textContent = "Lỗi kết nối với Google Drive. Hãy kiểm tra lại link Web App hoặc quyền chia sẻ thư mục.";
            }
        }

        /* ============================================================
           2) TÌM KIẾM ẢNH
        ============================================================ */
        function searchImages() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const gallery = document.getElementById("imageGallery");
            const noResult = document.getElementById("noResultMessage");

            gallery.innerHTML = "";

            if (query === "") {
                noResult.style.display = "block";
                noResult.textContent = "Vui lòng nhập mã để tìm kiếm.";
                return;
            }

            const filteredData = driveDatabase.filter(item =>
                item.name.toLowerCase().includes(query)
            );

            if (filteredData.length === 0) {
                noResult.style.display = "block";
                noResult.textContent = "Không tìm thấy hình ảnh nào khớp với mã bạn nhập.";
            } else {
                noResult.style.display = "none";

                filteredData.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "image-card";

                    const imgContainer = document.createElement("div");
                    imgContainer.className = "image-container";

                    const img = document.createElement("img");
                    img.src = item.url;
                    img.alt = item.name;
                    img.loading = "lazy";

                    const title = document.createElement("div");
                    title.className = "image-name";
                    title.textContent = item.name;

                    imgContainer.appendChild(img);
                    card.appendChild(imgContainer);
                    card.appendChild(title);
                    gallery.appendChild(card);
                });
            }
        }

        document.getElementById("searchInput").addEventListener("keypress", function (event) {
            if (event.key === "Enter" && !document.getElementById("searchInput").disabled) {
                searchImages();
            }
        });

        /* ============================================================
           3) QUÉT CAMERA — dùng Html5Qrcode (class lõi)
        ============================================================ */

        function showScanError(msg) {
            const el = document.getElementById("scan-error");
            el.style.display = "block";
            el.textContent = msg;
        }

        function hideScanError() {
            const el = document.getElementById("scan-error");
            el.style.display = "none";
            el.textContent = "";
        }

        async function openScanner() {
            // Chống mở trùng
            if (isScanning) return;

            // Kiểm tra môi trường bảo mật (bắt buộc HTTPS / localhost)
            const isSecure = location.protocol === "https:" ||
                             location.hostname === "localhost" ||
                             location.hostname === "127.0.0.1";
            if (!isSecure) {
                alert("Camera chỉ hoạt động khi trang được mở qua HTTPS hoặc localhost.\n\nHiện tại bạn đang mở qua: " + location.protocol + "//" + location.host +
                      "\n\nHãy deploy lên GitHub Pages / Netlify / Vercel (đều miễn phí và có HTTPS).");
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Trình duyệt không hỗ trợ truy cập camera. Hãy dùng Chrome / Samsung Internet / Safari bản mới nhất.");
                return;
            }

            // Hiện modal
            document.getElementById('scanner-modal').style.display = 'flex';
            hideScanError();

            // Dọn dẹp instance cũ nếu còn
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) {}
                try { html5QrCode.clear(); } catch (e) {}
                html5QrCode = null;
            }

            html5QrCode = new Html5Qrcode("reader", { verbose: false });

            // Cấu hình quét
            const config = {
                fps: 10,
                qrbox: function (viewfinderWidth, viewfinderHeight) {
                    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    const size = Math.floor(minEdge * 0.7);
                    return { width: size, height: size };
                },
                aspectRatio: 1.0,
                disableFlip: false
            };

            try {
                // Xin quyền + mở camera sau
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );

                isScanning = true;

                // Sau khi camera mở, cố gắng bật autofocus liên tục nếu máy hỗ trợ
                setTimeout(async () => {
                    try {
                        const video = document.querySelector('#reader video');
                        if (!video || !video.srcObject) return;
                        const track = video.srcObject.getVideoTracks()[0];
                        if (!track) return;
                        const caps = track.getCapabilities ? track.getCapabilities() : {};
                        if (caps.focusMode && caps.focusMode.includes('continuous')) {
                            await track.applyConstraints({
                                advanced: [{ focusMode: 'continuous' }]
                            });
                            console.log("Đã bật autofocus liên tục");
                        }
                    } catch (e) {
                        console.warn("Không thể bật focusMode:", e);
                    }
                }, 1500);

            } catch (err) {
                console.error("Lỗi mở camera:", err);
                let msg = "Không thể mở camera. ";
                if (err && err.name === "NotAllowedError") {
                    msg += "Bạn đã từ chối quyền truy cập camera. Hãy vào Cài đặt trình duyệt → Quyền → Camera → Cho phép cho trang này.";
                } else if (err && err.name === "NotFoundError") {
                    msg += "Không tìm thấy camera trên thiết bị.";
                } else if (err && err.name === "NotReadableError") {
                    msg += "Camera đang được ứng dụng khác sử dụng. Hãy đóng ứng dụng camera khác rồi thử lại.";
                } else {
                    msg += (err && err.message) ? err.message : String(err);
                }
                showScanError(msg);
                // Đóng modal sau khi báo lỗi
                setTimeout(() => {
                    if (!isScanning) {
                        document.getElementById('scanner-modal').style.display = 'none';
                    }
                }, 4000);
            }
        }

        async function closeScanner() {
            document.getElementById('scanner-modal').style.display = 'none';
            hideScanError();

            if (html5QrCode) {
                try {
                    if (isScanning) {
                        await html5QrCode.stop();
                    }
                    html5QrCode.clear();
                } catch (e) {
                    console.warn("Lỗi khi đóng camera:", e);
                }
                html5QrCode = null;
            }
            isScanning = false;
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Tạm dừng để tránh gọi liên tục
            if (!isScanning) return;
            isScanning = false;

            // Lấy phần trước dấu ; đầu tiên (nếu có)
            const extractedCode = decodedText.split(';')[0].trim();

            // Đưa vào ô tìm kiếm & tự động tìm
            document.getElementById('searchInput').value = extractedCode;

            // Đóng camera rồi tìm kiếm
            closeScanner().then(() => {
                searchImages();
            });
        }

        function onScanFailure(error) {
            // Bỏ qua lỗi khi chưa nhận diện được mã
        }

        /* ============================================================
           4) KHỞI ĐỘNG
        ============================================================ */
        fetchDriveData();

        // Đóng modal khi bấm ESC (tiện lợi trên desktop)
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && document.getElementById('scanner-modal').style.display === 'flex') {
                closeScanner();
            }
        });

        // Đăng ký Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Đăng ký Service Worker thành công!', reg))
                    .catch(err => console.log('Đăng ký Service Worker thất bại:', err));
            });
        }
    </script>
</body>
</html>
